<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" role="img" aria-labelledby="title desc">
  <title id="title">How a PolyBuxef market moves</title>
  <desc id="desc">A fictional Yes/No market starts at 50 %. Each purchase adds fictional tokens to the opposite pool,
  the constant-product rule k = Yes × No shrinks the chosen pool, the buyer receives the difference as shares,
  and the Yes probability moves. When the event ends, staff resolves the market and each winning share is worth 1 token.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .h { fill: #d1e4fa; font-size: 15px; font-weight: 600; }
    .t { fill: #d1e4fa; font-size: 14px; }
    .big { fill: #d1e4fa; font-size: 22px; font-weight: 700; }
    .s { fill: #9da7ba; font-size: 12px; }
    .m { fill: #d1e4fa; font-size: 12px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .step { fill: #d1e4fa; font-size: 15px; font-weight: 500; }
    .num { fill: #05060f; font-size: 13px; font-weight: 700; }
  </style>
  <rect width="960" height="470" rx="18" fill="#05060f"/>

  <rect x="30" y="70" width="300" height="280" rx="12" fill="#0d1220" stroke="#2b3446" stroke-width="2"/>
  <text x="48" y="98" class="h">Market</text>
  <rect x="350" y="70" width="300" height="280" rx="12" fill="#0d1220" stroke="#2b3446" stroke-width="2"/>
  <text x="368" y="98" class="h">Constant-product AMM</text>
  <rect x="670" y="70" width="260" height="280" rx="12" fill="#0d1220" stroke="#2b3446" stroke-width="2"/>
  <text x="688" y="98" class="h">Yes price history</text>
  <rect x="30" y="366" width="900" height="74" rx="12" fill="#0d1220" stroke="#2b3446" stroke-width="2"/>

  <text x="48" y="126" class="t">Will Engineering win the</text>
  <text x="48" y="146" class="t">Copa de la Mona final?</text>
  <text x="48" y="166" class="s">Fictional example · fictional tokens</text>
  <rect x="48" y="186" width="260" height="26" rx="6" fill="#e46d4c"/>
  <rect x="48" y="186" width="130.0" height="26" rx="6" fill="#2f92e8">
    <animate attributeName="width" dur="15.0s" repeatCount="indefinite" values="130.0;130.0;142.4;142.4;158.5;158.5;143.6;143.6;130.0" keyTimes="0.0000;0.2000;0.2467;0.4333;0.4800;0.6667;0.7133;0.9733;1.0000"/>
  </rect>
  <text x="48" y="240" class="s">YES</text>
  <text x="308" y="240" class="s" text-anchor="end">NO</text>
  <text x="48" y="266" class="big" text-anchor="start" opacity="0">50.0 %<animate attributeName="opacity" dur="15.0s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0.0000;0.0000;0.0080;0.2387;0.2467;1.0000"/></text>
    <text x="48" y="266" class="big" text-anchor="start" opacity="0">54.8 %<animate attributeName="opacity" dur="15.0s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0.0000;0.2467;0.2547;0.4720;0.4800;1.0000"/></text>
    <text x="48" y="266" class="big" text-anchor="start" opacity="0">61.0 %<animate attributeName="opacity" dur="15.0s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0.0000;0.4800;0.4880;0.7053;0.7133;1.0000"/></text>
    <text x="48" y="266" class="big" text-anchor="start" opacity="0">55.2 %<animate attributeName="opacity" dur="15.0s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0.0000;0.7133;0.7213;0.9653;0.9733;1.0000"/></text>
  <text x="308" y="266" class="big" text-anchor="end" opacity="0">50.0 %<animate attributeName="opacity" dur="15.0s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0.0000;0.0000;0.0080;0.2387;0.2467;1.0000"/></text>
    <text x="308" y="266" class="big" text-anchor="end" opacity="0">45.2 %<animate attributeName="opacity" dur="15.0s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0.0000;0.2467;0.2547;0.4720;0.4800;1.0000"/></text>
    <text x="308" y="266" class="big" text-anchor="end" opacity="0">39.0 %<animate attributeName="opacity" dur="15.0s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0.0000;0.4800;0.4880;0.7053;0.7133;1.0000"/></text>
    <text x="308" y="266" class="big" text-anchor="end" opacity="0">44.8 %<animate attributeName="opacity" dur="15.0s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0.0000;0.7133;0.7213;0.9653;0.9733;1.0000"/></text>
  <g>
    <rect x="48" y="296" width="94" height="26" rx="13" fill="none" stroke="#2f92e8" stroke-width="1.5">
      <animate attributeName="stroke" dur="15.0s" repeatCount="indefinite" values="#2f92e8;#2f92e8;#e8b94a;#e8b94a;#2f92e8" keyTimes="0.0000;0.7733;0.7867;0.9733;1.0000"/>
    </rect>
    <text x="95" y="314" class="s" text-anchor="middle" opacity="0">OPEN<animate attributeName="opacity" dur="15.0s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0.0000;0.0000;0.0067;0.7667;0.7733;1.0000"/></text>
    <text x="95" y="314" class="s" text-anchor="middle" opacity="0">RESOLVED<animate attributeName="opacity" dur="15.0s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0.0000;0.7733;0.7800;0.9733;0.9800;1.0000"/></text>
  </g>
  <text x="156" y="314" class="s" opacity="0">Winner: Yes · 1 share = 1 token<animate attributeName="opacity" dur="15.0s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0.0000;0.8000;0.8133;0.9667;0.9800;1.0000"/></text>

  <rect x="410" y="216.0" width="60" height="100.0" rx="6" fill="#2f92e8" opacity="0.9">
    <animate attributeName="height" dur="15.0s" repeatCount="indefinite" values="100.0;100.0;90.9;90.9;80.0;80.0;90.0;90.0;100.0" keyTimes="0.0000;0.1600;0.2000;0.3933;0.4333;0.6267;0.6667;0.9733;1.0000"/>
    <animate attributeName="y" dur="15.0s" repeatCount="indefinite" values="216.0;216.0;225.1;225.1;236.0;236.0;226.0;226.0;216.0" keyTimes="0.0000;0.1600;0.2000;0.3933;0.4333;0.6267;0.6667;0.9733;1.0000"/>
  </rect>
  <text x="440" y="338" class="s" text-anchor="middle">Yes pool</text>
  <text x="440" y="208.0" class="m" text-anchor="middle" opacity="0">1,000.0<animate attributeName="opacity" dur="15.0s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0.0000;0.0000;0.0080;0.1920;0.2000;1.0000"/></text>
  <text x="440" y="217.1" class="m" text-anchor="middle" opacity="0">909.1<animate attributeName="opacity" dur="15.0s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0.0000;0.2000;0.2080;0.4253;0.4333;1.0000"/></text>
  <text x="440" y="228.0" class="m" text-anchor="middle" opacity="0">800.0<animate attributeName="opacity" dur="15.0s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0.0000;0.4333;0.4413;0.6587;0.6667;1.0000"/></text>
  <text x="440" y="218.0" class="m" text-anchor="middle" opacity="0">900.0<animate attributeName="opacity" dur="15.0s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0.0000;0.6667;0.6747;0.9653;0.9733;1.0000"/></text>
  <rect x="530" y="216.0" width="60" height="100.0" rx="6" fill="#e46d4c" opacity="0.9">
    <animate attributeName="height" dur="15.0s" repeatCount="indefinite" values="100.0;100.0;110.0;110.0;125.0;125.0;111.1;111.1;100.0" keyTimes="0.0000;0.1600;0.2000;0.3933;0.4333;0.6267;0.6667;0.9733;1.0000"/>
    <animate attributeName="y" dur="15.0s" repeatCount="indefinite" values="216.0;216.0;206.0;206.0;191.0;191.0;204.9;204.9;216.0" keyTimes="0.0000;0.1600;0.2000;0.3933;0.4333;0.6267;0.6667;0.9733;1.0000"/>
  </rect>
  <text x="560" y="338" class="s" text-anchor="middle">No pool</text>
  <text x="560" y="208.0" class="m" text-anchor="middle" opacity="0">1,000.0<animate attributeName="opacity" dur="15.0s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0.0000;0.0000;0.0080;0.1920;0.2000;1.0000"/></text>
  <text x="560" y="198.0" class="m" text-anchor="middle" opacity="0">1,100.0<animate attributeName="opacity" dur="15.0s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0.0000;0.2000;0.2080;0.4253;0.4333;1.0000"/></text>
  <text x="560" y="183.0" class="m" text-anchor="middle" opacity="0">1,250.0<animate attributeName="opacity" dur="15.0s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0.0000;0.4333;0.4413;0.6587;0.6667;1.0000"/></text>
  <text x="560" y="196.9" class="m" text-anchor="middle" opacity="0">1,111.1<animate attributeName="opacity" dur="15.0s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0.0000;0.6667;0.6747;0.9653;0.9733;1.0000"/></text>
  <text x="368" y="124" class="m">k = Yes × No = 1,000,000</text>
  <text x="368" y="144" class="m">P(Yes) = No / (Yes + No)</text>
  <line x1="690" y1="243.3" x2="912" y2="243.3" stroke="#2b3446" stroke-dasharray="4 5"/>
  <text x="912" y="259.3" class="s" text-anchor="end">50 %</text>
  <line x1="690" y1="306" x2="912" y2="306" stroke="#2b3446"/>
  <circle cx="712" cy="243.3" r="5" fill="#2f92e8"/>
  <g opacity="0"><animate attributeName="opacity" dur="15.0s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0.0000;0.2000;0.2200;0.9600;0.9800;1.0000"/>
    <line x1="712" y1="243.3" x2="772" y2="216.4" stroke="#2f92e8" stroke-width="2.5"/>
    <circle cx="772" cy="216.4" r="5" fill="#2f92e8"/>
    <text x="772" y="204.4" class="s" text-anchor="middle">54.8</text>
  </g>
  <g opacity="0"><animate attributeName="opacity" dur="15.0s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0.0000;0.4333;0.4533;0.9600;0.9800;1.0000"/>
    <line x1="772" y1="216.4" x2="832" y2="181.1" stroke="#2f92e8" stroke-width="2.5"/>
    <circle cx="832" cy="181.1" r="5" fill="#2f92e8"/>
    <text x="832" y="169.1" class="s" text-anchor="middle">61.0</text>
  </g>
  <g opacity="0"><animate attributeName="opacity" dur="15.0s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0.0000;0.6667;0.6867;0.9600;0.9800;1.0000"/>
    <line x1="832" y1="181.1" x2="892" y2="213.6" stroke="#2f92e8" stroke-width="2.5"/>
    <circle cx="892" cy="213.6" r="5" fill="#2f92e8"/>
    <text x="892" y="201.6" class="s" text-anchor="middle">55.2</text>
  </g>
  <text x="690" y="332" class="s">open</text><text x="912" y="332" class="s" text-anchor="end">after 3 trades</text>
  <g opacity="0"><animate attributeName="opacity" dur="15.0s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0.0000;0.1000;0.1133;0.3200;0.3333;1.0000"/>
    <circle cx="56" cy="392" r="7" fill="#2f92e8"/>
    <text x="72" y="397" class="t"><tspan font-weight="600">You</tspan> use 100 tokens on <tspan fill="#2f92e8" font-weight="600">Yes</tspan> → receive 90.9 shares</text>
    <text x="50" y="424" class="m">No pool = 1,000 + 100 = 1,100.0   ·   Yes pool = k / 1,100.0 = 909.1   ·   shares = 1,000.0 − 909.1 = 90.9</text>
  </g>
  <g opacity="0"><animate attributeName="opacity" dur="15.0s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0.0000;0.3333;0.3467;0.5533;0.5667;1.0000"/>
    <circle cx="56" cy="392" r="7" fill="#2f92e8"/>
    <text x="72" y="397" class="t"><tspan font-weight="600">Ana</tspan> uses 150 tokens on <tspan fill="#2f92e8" font-weight="600">Yes</tspan> → receive 109.1 shares</text>
    <text x="50" y="424" class="m">No pool = 1,100 + 150 = 1,250.0   ·   Yes pool = k / 1,250.0 = 800.0   ·   shares = 909.1 − 800.0 = 109.1</text>
  </g>
  <g opacity="0"><animate attributeName="opacity" dur="15.0s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0.0000;0.5667;0.5800;0.7600;0.7733;1.0000"/>
    <circle cx="56" cy="392" r="7" fill="#e46d4c"/>
    <text x="72" y="397" class="t"><tspan font-weight="600">Ben</tspan> uses 100 tokens on <tspan fill="#e46d4c" font-weight="600">No</tspan> → receive 138.9 shares</text>
    <text x="50" y="424" class="m">Yes pool = 800 + 100 = 900.0   ·   No pool = k / 900.0 = 1,111.1   ·   shares = 1,250.0 − 1,111.1 = 138.9</text>
  </g>
  <g opacity="0"><animate attributeName="opacity" dur="15.0s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0.0000;0.0000;0.0133;0.0867;0.1000;1.0000"/>
    <text x="50" y="397" class="t">Both pools start equal, so each side starts at 50 %.</text>
    <text x="50" y="424" class="m">Every trade keeps k constant: one pool grows, the other shrinks, and the price follows.</text>
  </g>
  <g opacity="0"><animate attributeName="opacity" dur="15.0s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0.0000;0.7733;0.7867;0.9667;0.9800;1.0000"/>
    <text x="50" y="397" class="t">The event ends. A staff member resolves the market, and holders redeem winning shares.</text>
    <text x="50" y="424" class="m">No real money: tokens are fictional and only used for the community ranking.</text>
  </g>

