    <circle cx="44" cy="40" r="13" fill="#d1e4fa"/>
    <text x="44" y="45" text-anchor="middle" class="num">1</text>
    <text x="68" y="45" class="step">A market opens with two equal pools: Yes = 50 %</text>
  </g>
  <g opacity="0"><animate attributeName="opacity" dur="15.0s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0.0000;0.1000;0.1133;0.3200;0.3333;1.0000"/>
