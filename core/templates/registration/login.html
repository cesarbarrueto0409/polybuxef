{% extends "base.html" %}
{% block title %}Iniciar sesión — Polybuxef{% endblock %}

{% block content %}
<div style="max-width:400px;margin:2rem auto 0;">
  <h1 class="page-title" style="text-align:center;">Iniciar sesión</h1>

  {% if error %}
  <div class="card" style="border-color:rgba(224,53,53,.3);background:rgba(224,53,53,.08);color:var(--no);margin-bottom:1.2rem;">
    {{ error }}
  </div>
  {% endif %}

  <div class="card">
    <form method="post">
      {% csrf_token %}
      <div class="form-group">
        <label for="username">Usuario</label>
        <input class="input-field" id="username" name="username" type="text" required autofocus>
      </div>
      <div class="form-group">
        <label for="password">Contraseña</label>
        <input class="input-field" id="password" name="password" type="password" required>
      </div>
      <button class="btn btn-yes" style="width:100%;margin-top:0.5rem;" type="submit">Entrar</button>
    </form>
  </div>

  <p style="text-align:center;margin-top:1.5rem;font-size:0.9rem;color:var(--muted);">
    ¿No tienes cuenta?
    <a href="{% url 'registro' %}" style="color:var(--accent);font-weight:700;text-decoration:none;">Regístrate</a>
  </p>
</div>
{% endblock %}
