{% extends "base.html" %}
{% block title %}Iniciar sesión - Polybuxef{% endblock %}

{% block content %}
<div style="max-width:400px; margin:4rem auto;">
  <h1 class="page-title" style="text-align:center; margin-bottom:2rem;">Iniciar sesión</h1>

  {% if error %}
  <div style="background:rgba(214,48,49,.15); border:1px solid var(--no); border-radius:8px;
              padding:.8rem 1rem; margin-bottom:1.2rem; color:var(--no); font-size:.9rem;">
    {{ error }}
  </div>
  {% endif %}

  <div class="card">
    <form method="post">
      {% csrf_token %}
      <div class="form-group">
        <label for="username">Usuario</label>
        <input class="input-field" id="username" name="username" type="text" required autofocus>
      </div>
      <div class="form-group">
        <label for="password">Contraseña</label>
        <input class="input-field" id="password" name="password" type="password" required>
      </div>
      <button class="btn btn-primary" style="width:100%; margin-top:.5rem;" type="submit">
        Entrar
      </button>
    </form>
  </div>

  <p style="text-align:center; margin-top:1.2rem; font-size:.9rem; color:var(--muted);">
    ¿No tienes cuenta?
    <a href="{% url 'registro' %}" style="color:var(--accent);">Registrate</a>
  </p>
</div>
{% endblock %}
