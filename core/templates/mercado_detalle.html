{% extends "base.html" %}
{% block title %}Mercado — Polybuxef{% endblock %}

{% block extra_head %}
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
  .mkt-back {
    display: inline-flex; align-items: center; gap: 0.4rem;
    color: var(--muted); text-decoration: none; font-size: 0.8rem; font-weight: 600;
    margin-bottom: 1.5rem; transition: color 0.15s;
  }
  .mkt-back:hover { color: #111; }

  .mkt-meta { display: flex; gap: 0.6rem; align-items: center; flex-wrap: wrap; margin-bottom: 0.85rem; }
  .meta-tag { font-size: 0.78rem; color: var(--muted); }

  .mkt-title {
    font-size: clamp(1.5rem, 2.5vw, 2.2rem);
    font-weight: 700; letter-spacing: -0.5px;
    color: #111; line-height: 1.2; margin-bottom: 0.5rem;
  }

  .mkt-desc { font-size: 0.88rem; color: var(--muted); line-height: 1.6; margin-bottom: 1.5rem; max-width: 640px; }

  .mkt-header-stats {
    display: inline-flex; gap: 0;
    background: #fff; border: 1px solid #e0e0e0; border-radius: var(--radius); overflow: hidden;
  }
  .mkt-stat-box { padding: 0.7rem 1.4rem; border-right: 1px solid #eee; }
  .mkt-stat-box:last-child { border-right: none; }
  .mkt-stat-val { font-size: 1rem; font-weight: 700; color: #111; }
  .mkt-stat-lbl { font-size: 0.68rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; margin-top: 0.1rem; font-weight: 600; }

  .resolved-banner {
    display: inline-flex; align-items: center; gap: 0.5rem;
    background: rgba(124,111,247,.08); border: 1px solid rgba(124,111,247,.2);
    border-radius: 9999px; padding: 0.4rem 1rem;
    font-size: 0.82rem; font-weight: 700; color: var(--accent); margin-bottom: 1.5rem;
  }

  .mkt-body { display: grid; gap: 1.25rem; grid-template-columns: 1fr 320px; align-items: start; margin-top: 1.5rem; }
  .mkt-left { display: flex; flex-direction: column; gap: 1.25rem; }

  .yes-no-table { width: 100%; border-collapse: collapse; }
  .yes-no-table th { font-size: 0.7rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; padding: 0.85rem 1.25rem; text-align: left; border-bottom: 1px solid #eee; font-weight: 700; }
  .yes-no-table td { padding: 0.85rem 1.25rem; border-bottom: 1px solid #f3f3f3; color: #111; font-size: 0.875rem; }
  .yes-no-table tr:last-child td { border-bottom: none; }

  .trade-panel { position: sticky; top: 80px; }
  .trade-panel-title { font-size: 0.72rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; font-weight: 700; margin-bottom: 1.25rem; }

  .tab-row { display: flex; gap: 0.4rem; margin-bottom: 1.25rem; }
  .tab-pill {
    flex: 1; background: #f5f5f5; border: 1px solid #e0e0e0; border-radius: 9999px;
    color: var(--muted); font-size: 0.8rem; font-weight: 700; padding: 0.5rem 1rem;
    cursor: pointer; font-family: 'Manrope', sans-serif; transition: all 0.15s;
  }
  .tab-pill.active { background: #111; color: #fff; border-color: #111; }
  .tab-pill:hover:not(.active) { border-color: var(--accent); color: var(--accent); }

  .trade-label { font-size: 0.75rem; color: var(--muted); font-weight: 600; display: block; margin-bottom: 0.35rem; }
  .preview-box { background: #f5f5f5; border-radius: var(--radius-sm); padding: 0.75rem 1rem; margin-bottom: 0.75rem; display: none; }
  .preview-row { display: flex; justify-content: space-between; font-size: 0.8rem; color: var(--muted); padding: 0.2rem 0; }
  .preview-row span:last-child { color: #111; font-weight: 600; }
  .sel-label { font-size: 0.75rem; color: var(--muted); margin-bottom: 0.75rem; min-height: 1em; }

  .resolver-card { border-color: rgba(224,53,53,.25) !important; margin-top: 1.25rem; }
  .resolver-title { font-size: 0.7rem; color: var(--no); text-transform: uppercase; letter-spacing: 0.5px; font-weight: 700; margin-bottom: 0.4rem; }
  .resolver-desc  { font-size: 0.78rem; color: var(--muted); margin-bottom: 0.75rem; line-height: 1.5; }
  .btn-resolver {
    display: block; width: 100%; background: #f5f5f5; color: #111; border: 1px solid #e0e0e0;
    border-radius: var(--radius-sm); padding: 0.55rem 1rem; font-size: 0.82rem; font-weight: 600;
    cursor: pointer; text-align: left; margin-bottom: 0.4rem; font-family: 'Manrope', sans-serif;
    transition: background 0.15s, border-color 0.15s;
  }
  .btn-resolver:last-child { margin-bottom: 0; }
  .btn-resolver:hover { background: #ededff; border-color: var(--accent); }

  @media (max-width: 860px) {
    .mkt-body { grid-template-columns: 1fr; }
    .trade-panel { position: static; }
  }
</style>
{% endblock %}

{% block content %}
<a href="{% url 'home' %}" class="mkt-back">
  <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M19 12H5M5 12l7-7M5 12l7 7" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"/></svg>
  Volver a mercados
</a>
<div class="mkt-meta" id="mkt-meta"></div>
<h1 class="mkt-title" id="mkt-title">Cargando...</h1>
<p class="mkt-desc" id="mkt-desc"></p>
<div id="mkt-resolved"></div>
<div class="mkt-header-stats" id="mkt-stats" style="display:none;">
  <div class="mkt-stat-box"><div class="mkt-stat-val" id="stat-cierre">—</div><div class="mkt-stat-lbl">Fecha cierre</div></div>
  <div class="mkt-stat-box"><div class="mkt-stat-val" id="stat-liquidez">—</div><div class="mkt-stat-lbl">Liquidez</div></div>
  <div class="mkt-stat-box"><div class="mkt-stat-val" id="stat-opciones">—</div><div class="mkt-stat-lbl">Opciones</div></div>
</div>

<div class="mkt-body">
  <div class="mkt-left">
    <div class="card" id="chart-card" style="display:none;">
      <div style="position:relative;height:240px;"><canvas id="price-chart"></canvas></div>
    </div>
  </div>

  <div>
    <div class="card trade-panel" id="trade-panel">
      <p style="color:var(--muted);font-size:0.85rem;">Cargando...</p>
    </div>
    <div id="resolver-wrap"></div>
  </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
  const MERCADO_ID = {{ mercado_id }};
  const ES_ADMIN = {% if es_admin %}true{% else %}false{% endif %};
  let mercadoData = null;
  let selectedOpcionId = null;
  let mode = 'comprar';
  let priceChart = null;

  async function loadMercado() {
    const r = await fetch(`/api/mercado/${MERCADO_ID}/`);
    if (!r.ok) { document.getElementById('mkt-title').textContent = 'Mercado no encontrado'; return; }
    mercadoData = await r.json();
    renderHeader();
    renderBody();
    loadChart();
  }

  function renderHeader() {
    const m = mercadoData;
    const cierre = new Date(m.fecha_cierre).toLocaleDateString('es-CL',{day:'numeric',month:'long',year:'numeric'});
    const badges = {abierto:'badge-open',cerrado:'badge-closed',resuelto:'badge-resuelto',cancelado:'badge-closed'};
    const labels = {abierto:'Abierto',cerrado:'Cerrado',resuelto:'Resuelto',cancelado:'Cancelado'};
    const ganadora = m.opciones.find(o => o.es_ganadora === true);

    document.getElementById('mkt-meta').innerHTML = `
      <span class="badge ${badges[m.estado]||'badge-closed'}">${labels[m.estado]||m.estado}</span>
      ${m.categoria ? `<span class="meta-tag">${m.categoria}</span>` : ''}
    `;
    document.getElementById('mkt-title').textContent = m.titulo;
    document.getElementById('mkt-desc').textContent = m.descripcion || '';

    if (ganadora) {
      document.getElementById('mkt-resolved').innerHTML =
        `<div class="resolved-banner">🏆 ${ganadora.nombre} ganó</div>`;
    }

    document.getElementById('stat-cierre').textContent = cierre;
    document.getElementById('stat-liquidez').textContent = '$' + parseFloat(m.liquidez_total||0).toLocaleString('es-CL',{maximumFractionDigits:0});
    document.getElementById('stat-opciones').textContent = m.opciones.length;
    document.getElementById('mkt-stats').style.display = '';
  }

  function renderBody() {
    const m = mercadoData;
    const ganadora = m.opciones.find(o => o.es_ganadora === true);

    document.getElementById('chart-card').style.display = '';

    document.getElementById('trade-panel').innerHTML = m.estado === 'resuelto'
      ? renderResuelto(ganadora)
      : renderTrading();

    if (m.estado === 'abierto') {
      selectedOpcionId = m.opciones[0]?.id;
      renderOpciones();
      document.getElementById('monto-input')?.addEventListener('input', actualizarPrevista);
    }

    if (m.estado === 'abierto' && ES_ADMIN)  {
      document.getElementById('resolver-wrap').innerHTML = `
        <div class="card resolver-card">
          <div class="resolver-title">Resolver mercado</div>
          <div class="resolver-desc">Selecciona la opción ganadora para cerrar el mercado.</div>
          ${m.opciones.map(o=>`<button onclick="resolverMercado(${o.id})" class="btn-resolver">🏆 ${o.nombre} ganó</button>`).join('')}
        </div>`;
    }
  }

  function renderTrading() {
    return `
      <div class="trade-panel-title">Operar</div>
      <div id="opciones-selector" style="display:flex;flex-direction:column;gap:0.5rem;margin-bottom:1.25rem;"></div>
      <div class="tab-row">
        <button class="tab-pill active" onclick="establecerModo('comprar',this)">Comprar</button>
        <button class="tab-pill" onclick="establecerModo('vender',this)">Vender</button>
      </div>
      <div id="panel-comprar">
        <label class="trade-label">Monto a invertir ($)</label>
        <input type="number" id="monto-input" class="input-field" placeholder="100" min="1" step="1" style="margin-bottom:0.75rem;">
        <div class="preview-box" id="preview-box">
          <div class="preview-row"><span>Shares estimados</span><span id="est-shares">—</span></div>
          <div class="preview-row"><span>Precio unitario</span><span id="est-precio">—</span></div>
        </div>
        <button onclick="ejecutarCompra()" class="btn btn-yes" style="width:100%;">Confirmar compra</button>
      </div>
      <div id="panel-vender" style="display:none;">
        <label class="trade-label">Shares a vender</label>
        <input type="number" id="shares-input" class="input-field" placeholder="50" min="0.001" step="0.001" style="margin-bottom:0.75rem;">
        <div class="sel-label" id="mis-shares-label"></div>
        <button onclick="ejecutarVenta()" class="btn btn-no" style="width:100%;">Confirmar venta</button>
      </div>`;
  }

  function renderOpciones() {
    const m = mercadoData;
    const container = document.getElementById('opciones-selector');
    if (!container) return;
    container.innerHTML = m.opciones.map((o, i) => {
      const pct = (o.precio * 100).toFixed(1);
      const color = i === 0 ? '#00a87a' : '#c82020';
      const bgColor = i === 0 ? 'rgba(0,200,150,0.08)' : 'rgba(224,53,53,0.08)';
      const borderSel = i === 0 ? '#00a87a' : '#c82020';
      const isSelected = o.id === selectedOpcionId;
      return `
        <button onclick="selectOpcion(${o.id})" id="opcion-btn-${o.id}" style="
          width:100%; background:${isSelected ? bgColor : '#f5f5f5'};
          border:1.5px solid ${isSelected ? borderSel : '#e0e0e0'};
          border-radius:8px; padding:0.75rem 1rem; cursor:pointer;
          font-family:'Manrope',sans-serif; transition:all 0.15s;
          display:flex; align-items:center; justify-content:space-between;
        ">
          <span style="font-size:0.875rem;font-weight:600;color:#111;">${o.nombre}</span>
          <div style="display:flex;align-items:center;gap:0.75rem;">
            <div style="width:80px;">
              <div style="background:#eee;border-radius:3px;height:4px;">
                <div style="width:${pct}%;height:100%;border-radius:3px;background:${color};"></div>
              </div>
            </div>
            <span style="font-size:0.875rem;font-weight:700;color:${color};min-width:40px;text-align:right;">${pct}%</span>
          </div>
        </button>`;
    }).join('');
  }

  function selectOpcion(opcionId) {
    selectedOpcionId = opcionId;
    renderOpciones();
    loadMisShares(opcionId);
    actualizarPrevista();
  }

  function renderResuelto(ganadora) {
    if (!ganadora) return '<p style="color:var(--muted);text-align:center;padding:1rem 0;font-size:0.875rem;">Mercado resuelto.</p>';
    return `
      <div style="text-align:center;padding:1.5rem 0;">
        <div style="font-size:2.5rem;margin-bottom:0.75rem;">🏆</div>
        <div style="font-size:1.05rem;font-weight:700;color:#111;margin-bottom:0.25rem;">${ganadora.nombre} ganó</div>
        <div style="font-size:0.8rem;color:var(--muted);margin-bottom:1.5rem;">Mercado cerrado</div>
        <p style="font-size:0.82rem;color:var(--muted);line-height:1.6;">
          Ve a tu <a href="/portafolio/${USUARIO_ID}/" style="color:var(--accent);font-weight:700;">portafolio</a> para redimir tus shares ganadores.
        </p>
      </div>`;
  }

  function establecerModo(m, btn) {
    mode = m;
    document.querySelectorAll('.tab-pill').forEach(b => b.classList.remove('active'));
    if (btn) btn.classList.add('active');
    document.getElementById('panel-comprar').style.display = m==='comprar' ? '' : 'none';
    document.getElementById('panel-vender').style.display  = m==='vender'  ? '' : 'none';
    if (m==='vender' && selectedOpcionId) loadMisShares(selectedOpcionId);
  }

  function actualizarPrevista() {
    const monto = parseFloat(document.getElementById('monto-input')?.value);
    const box = document.getElementById('preview-box');
    if (!box) return;
    if (!monto || !selectedOpcionId) { box.style.display='none'; return; }
    const op   = mercadoData.opciones.find(o => o.id===selectedOpcionId);
    const otra = mercadoData.opciones.find(o => o.id!==selectedOpcionId);
    if (!op||!otra) return;
    const shares = op.tokens - (op.tokens*otra.tokens)/(otra.tokens+monto);
    document.getElementById('est-shares').textContent = shares.toFixed(4);
    document.getElementById('est-precio').textContent = `$${(monto/shares).toFixed(4)}`;
    box.style.display = '';
  }

  async function loadMisShares(opcionId) {
    if (!USUARIO_ID) return;
    try {
      const d = await (await fetch(`/api/portafolio/${USUARIO_ID}/`)).json();
      const pos = d.portafolio.find(p => p.opcion_id===opcionId);
      const el = document.getElementById('mis-shares-label');
      if (el) el.textContent = pos ? `Tienes: ${pos.shares.toFixed(4)} shares` : 'No tienes shares de esta opción';
    } catch {}
  }

  async function ejecutarCompra() {
    if (!USUARIO_ID) { toast('Inicia sesión para operar','err'); return; }
    const monto = parseFloat(document.getElementById('monto-input')?.value);
    if (!monto||monto<=0) { toast('Ingresa un monto válido','err'); return; }
    if (!selectedOpcionId) { toast('Selecciona una opción en la tabla','err'); return; }
    const d = await (await fetch('/comprar/',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({id_usuario:USUARIO_ID,id_opcion:selectedOpcionId,monto})})).json();
    if (d.ok) { toast(`Compraste ${parseFloat(d.shares).toFixed(4)} shares`,'ok'); obtenerSaldo(); loadMercado(); }
    else toast(d.error||'Error','err');
  }

  async function ejecutarVenta() {
    if (!USUARIO_ID) { toast('Inicia sesión para operar','err'); return; }
    const shares = parseFloat(document.getElementById('shares-input')?.value);
    if (!shares||shares<=0) { toast('Ingresa shares válidos','err'); return; }
    if (!selectedOpcionId) { toast('Selecciona una opción en la tabla','err'); return; }
    const d = await (await fetch('/vender/',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({id_usuario:USUARIO_ID,id_opcion:selectedOpcionId,shares})})).json();
    if (d.ok) { toast(`Vendiste por $${parseFloat(d.monto).toFixed(2)}`,'ok'); obtenerSaldo(); loadMercado(); }
    else toast(d.error||'Error','err');
  }

  async function resolverMercado(opcionId) {
    const op = mercadoData.opciones.find(o => o.id===opcionId);
    if (!confirm(`¿Declarar a "${op?.nombre}" como ganador?`)) return;
    const d = await (await fetch(`/api/mercado/${MERCADO_ID}/resolver/`,{method:'POST',
      headers:{'Content-Type':'application/json'},body:JSON.stringify({opcion_ganadora_id:opcionId})})).json();
    if (d.ok) { toast(`Resuelto: ${d.opcion_ganadora} ganó`,'ok'); loadMercado(); }
    else toast(d.error||'Error','err');
  }

  const MESES = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];

  function formatearEje(dateStr) {
    const d = new Date(dateStr);
    const h = d.getHours(), ampm = h >= 12 ? 'pm' : 'am', h12 = h % 12 || 12;
    return `${h12} ${ampm}`;
  }

  function formatearTooltip(dateStr) {
    const d = new Date(dateStr);
    const h = d.getHours(), min = d.getMinutes().toString().padStart(2,'0');
    const ampm = h >= 12 ? 'pm' : 'am', h12 = h % 12 || 12;
    return `${d.getDate()} ${MESES[d.getMonth()]}, ${h12}:${min} ${ampm}`;
  }

  async function loadChart() {
    const data = await (await fetch(`/api/mercado/${MERCADO_ID}/historial/`)).json();
    const canvas = document.getElementById('price-chart');
    if (!canvas) return;
    const colors = ['#00a87a','#c82020','#6c5ce7','#e67e00'];

    const maxPuntos = Math.max(0, ...Object.values(data.historial).map(puntos => puntos.length));
    const allTimestamps = Array.from({length: maxPuntos}, (_, i) => {
      for (const puntos of Object.values(data.historial)) {
        if (puntos[i]) return puntos[i].fecha;
      }
      return null;
    });

    const datasets = Object.entries(data.historial).map(([nombre,puntos],i) => {
      return {
        label: nombre,
        data: allTimestamps.map((_, idx) => puntos[idx] ? parseFloat((puntos[idx].precio*100).toFixed(2)) : null),
        borderColor: colors[i%colors.length],
        backgroundColor: colors[i%colors.length]+'15',
        borderWidth: 2,
        pointRadius: allTimestamps.length < 20 ? 3 : 0,
        pointHoverRadius: 5,
        tension: 0.4,
        fill: false,
        spanGaps: true,
      };
    });

    const labelAnim = {};

    function resolverColisiones(items, minGap) {
      if (items.length < 2) return items;
      const arr = items.map(x => ({ ...x }));
      for (let pass = 0; pass < 30; pass++) {
        arr.sort((a, b) => a.y - b.y);
        let moved = false;
        for (let i = 1; i < arr.length; i++) {
          const gap = arr[i].y - arr[i - 1].y;
          if (gap < minGap) {
            const push = (minGap - gap) / 2;
            arr[i - 1].y -= push;
            arr[i].y += push;
            moved = true;
          }
        }
        if (!moved) break;
      }
      return arr;
    }

    const endLabelPlugin = {
      id: 'endLabel',
      afterDatasetsDraw(chart) {
        const { ctx, scales: { x, y }, chartArea, canvas } = chart;
        const active = chart.tooltip?._active || [];
        const hoverIdx = active.length > 0 ? active[0].index : -1;
        const isHovering = hoverIdx >= 0;

        if (isHovering) {
          const hoverX = x.getPixelForValue(hoverIdx);

          ctx.save();
          ctx.fillStyle = 'rgba(255,255,255,0.80)';
          ctx.fillRect(hoverX, chartArea.top, canvas.width - hoverX, chartArea.bottom - chartArea.top);
          ctx.restore();

          ctx.save();
          ctx.strokeStyle = 'rgba(0,0,0,0.15)';
          ctx.lineWidth = 1;
          ctx.setLineDash([4, 4]);
          ctx.beginPath();
          ctx.moveTo(hoverX, chartArea.top);
          ctx.lineTo(hoverX, chartArea.bottom);
          ctx.stroke();
          ctx.restore();

          const dateStr = allTimestamps[hoverIdx];
          if (dateStr) {
            ctx.save();
            ctx.font = '600 11px Manrope, sans-serif';
            ctx.fillStyle = '#555';
            ctx.textAlign = 'left';
            ctx.fillText(formatearTooltip(dateStr), hoverX + 8, chartArea.top + 14);
            ctx.restore();
          }
        }

        const targets = [];
        chart.data.datasets.forEach((ds, i) => {
          let labelIdx = -1, labelVal = null;
          const searchFrom = isHovering ? hoverIdx : ds.data.length - 1;
          for (let j = searchFrom; j >= 0; j--) {
            if (ds.data[j] !== null && ds.data[j] !== undefined) {
              labelIdx = j; labelVal = ds.data[j]; break;
            }
          }
          if (labelIdx === -1) return;
          const px = x.getPixelForValue(labelIdx);
          const naturalY = y.getPixelForValue(labelVal);
          if (labelAnim[i] === undefined) labelAnim[i] = naturalY;
          targets.push({ i, px, labelVal, naturalY });
        });

        const resolved = resolverColisiones(
          targets.map(t => ({ ...t, y: t.naturalY })), 46
        );

        resolved.forEach(r => {
          r.y = Math.max(chartArea.top + 24, Math.min(chartArea.bottom - 8, r.y));
        });

        const resolvedMap = {};
        resolved.forEach(r => { resolvedMap[r.i] = r.y; });

        let needsRedraw = false;
        targets.forEach(({ i, px, labelVal }) => {
          const targetY = resolvedMap[i] ?? labelAnim[i];
          const diff = targetY - labelAnim[i];
          if (Math.abs(diff) > 0.3) {
            labelAnim[i] += diff * 0.03;
            needsRedraw = true;
          } else {
            labelAnim[i] = targetY;
          }

          const py = labelAnim[i];
          const color = chart.data.datasets[i].borderColor;
          ctx.save();
          ctx.fillStyle = color;
          ctx.textAlign = 'left';
          ctx.font = '700 10px Manrope, sans-serif';
          ctx.fillText(chart.data.datasets[i].label.toUpperCase(), px + 12, py - 10);
          ctx.font = '800 20px Manrope, sans-serif';
          ctx.fillText(`${labelVal.toFixed(1)}%`, px + 12, py + 12);
          ctx.restore();
        });

        if (needsRedraw) requestAnimationFrame(() => chart.draw());
      }
    };

    if (priceChart) priceChart.destroy();
    priceChart = new Chart(canvas, {
      type: 'line',
      data: { labels: allTimestamps, datasets },
      plugins: [endLabelPlugin],
      options: {
        responsive: true,
        maintainAspectRatio: false,
        interaction: { mode:'index', intersect:false },
        layout: { padding: { right: 110, bottom: 8 } },
        scales: {
          x: {
            type: 'category',
            ticks: {
              color: '#bbb',
              maxTicksLimit: 7,
              maxRotation: 0,
              callback: (val, idx) => formatearEje(allTimestamps[idx] || val),
            },
            grid: { color: '#f0eeff' },
            border: { display: false },
          },
          y: {
            min: 0, max: 100,
            ticks: { color: '#bbb', callback: v => v + '%', maxTicksLimit: 5 },
            grid: { color: '#f0eeff' },
            border: { display: false },
          },
        },
        plugins: {
          legend: { display: false },
          tooltip: { enabled: false },
        },
      },
    });
  }

  loadMercado();
</script>
