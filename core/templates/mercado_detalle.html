{% extends "base.html" %}
{% block title %}Mercado — Polybuxef{% endblock %}

{% block extra_head %}
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
  .yes-no-table { width:100%; border-collapse:collapse; }
  .yes-no-table th { font-size:.75rem; color:var(--muted); text-transform:uppercase; letter-spacing:.5px; padding:.5rem .75rem; text-align:left; }
  .yes-no-table td { padding:.6rem .75rem; border-top:1px solid var(--border); }
  .yes-no-table tr:hover td { background:rgba(255,255,255,.02); }

  .pill { display:inline-flex; align-items:center; gap:.3rem; padding:.28rem .7rem; border-radius:20px; font-size:.78rem; font-weight:600; }
  .pill-win  { background:rgba(0,184,148,.15); color:var(--yes); }
  .pill-lose { background:rgba(214,48,49,.15);  color:var(--no); }

  .tab-btn { background:none; border:none; color:var(--muted); font-size:.88rem; font-weight:600; padding:.5rem 1rem; cursor:pointer; border-bottom:2px solid transparent; transition:all .15s; }
  .tab-btn.active { color:var(--text); border-bottom-color:var(--accent); }

  .resolved-banner { background:rgba(108,92,231,.12); border:1px solid var(--accent); border-radius:var(--radius); padding:1rem 1.25rem; margin-bottom:1rem; }
</style>
{% endblock %}

{% block content %}
<div style="margin-bottom:1rem;">
  <a href="/" class="btn btn-secondary btn-sm">← Volver</a>
</div>
<div id="mercado-content"><p style="color:var(--muted)">Cargando...</p></div>
{% endblock %}

{% block extra_js %}
<script>
const MERCADO_ID = {{ mercado_id }};
let mercadoData = null;
let selectedOpcionId = null;
let mode = 'comprar';
let priceChart = null;

async function loadMercado() {
  const r = await fetch(`/api/mercado/${MERCADO_ID}/`);
  if (!r.ok) { document.getElementById('mercado-content').innerHTML='<p style="color:var(--no)">Mercado no encontrado.</p>'; return; }
  mercadoData = await r.json();
  renderMercado();
  loadChart();
}

function renderMercado() {
  const m = mercadoData;
  const cierre = new Date(m.fecha_cierre).toLocaleDateString('es-CL',{day:'numeric',month:'long',year:'numeric'});
  const estadoBadge = {abierto:'badge-open',cerrado:'badge-closed',resuelto:'badge-resuelto',cancelado:'badge-closed'}[m.estado] || 'badge-closed';
  const estadoLabel = {abierto:'Abierto',cerrado:'Cerrado',resuelto:'Resuelto',cancelado:'Cancelado'}[m.estado];
  const ganadora = m.opciones.find(o => o.es_ganadora === true);

  document.getElementById('mercado-content').innerHTML = `
    <div style="display:grid;gap:1.5rem;grid-template-columns:1fr 340px;align-items:start;">

      <!-- Columna izquierda -->
      <div>
        <div style="display:flex;gap:.75rem;align-items:center;flex-wrap:wrap;margin-bottom:.75rem;">
          <span class="badge ${estadoBadge}">${estadoLabel}</span>
          <span style="font-size:.82rem;color:var(--muted)">${m.categoria}</span>
          <span style="font-size:.82rem;color:var(--muted)">Cierre: ${cierre}</span>
        </div>
        <h1 style="font-size:1.55rem;font-weight:700;margin-bottom:.4rem;">${m.titulo}</h1>
        <p style="color:var(--muted);margin-bottom:1.5rem;font-size:.92rem;">${m.descripcion||''}</p>

        ${ganadora ? `<div class="resolved-banner">
          <div style="font-size:.8rem;color:var(--muted);margin-bottom:.25rem;">RESULTADO OFICIAL</div>
          <div style="font-size:1.1rem;font-weight:700;color:var(--accent)">🏆 ${ganadora.nombre} ganó</div>
        </div>` : ''}

        <!-- Tabla YES/NO por opción -->
        <div class="card" style="margin-bottom:1rem;padding:0;overflow:hidden;">
          <table class="yes-no-table">
            <thead>
              <tr>
                <th>Opción</th>
                <th style="text-align:center">Probabilidad</th>
                <th style="text-align:center">Comprar SÍ gana</th>
                <th style="text-align:center">Comprar NO gana</th>
              </tr>
            </thead>
            <tbody id="opciones-tbody"></tbody>
          </table>
        </div>

        <!-- Gráfico -->
        <div class="card">
          <h3 style="font-size:.85rem;color:var(--muted);margin-bottom:1rem;text-transform:uppercase;letter-spacing:.5px;">Historial de probabilidades</h3>
          <div style="position:relative;height:200px;">
            <canvas id="price-chart"></canvas>
          </div>
        </div>
      </div>

      <!-- Panel derecho -->
      <div>
        <div class="card" style="position:sticky;top:80px;" id="trade-panel">
          ${m.estado === 'resuelto' ? renderPanelResuelto(m, ganadora) : renderPanelTrading(m)}
        </div>

        ${m.estado === 'abierto' ? `
        <div class="card" style="margin-top:1rem;border-color:rgba(214,48,49,.3);">
          <h3 style="font-size:.85rem;color:var(--no);margin-bottom:.75rem;text-transform:uppercase;letter-spacing:.5px;">Resolver mercado</h3>
          <p style="font-size:.8rem;color:var(--muted);margin-bottom:.75rem;">Selecciona la opción ganadora para cerrar el mercado.</p>
          <div style="display:flex;flex-direction:column;gap:.5rem;" id="resolver-btns">
            ${m.opciones.map(o=>`
            <button onclick="resolverMercado(${o.id})" class="btn btn-secondary" style="justify-content:flex-start;">
              🏆 ${o.nombre} ganó
            </button>`).join('')}
          </div>
        </div>` : ''}
      </div>
    </div>
  `;

  renderOpcionesTabla();
  if (m.estado === 'abierto') {
    selectedOpcionId = m.opciones[0]?.id;
    document.getElementById('monto-comprar')?.addEventListener('input', updatePreview);
  }
}

function renderPanelTrading(m) {
  return `
    <div style="display:flex;gap:0;margin-bottom:1.25rem;border-bottom:1px solid var(--border);">
      <button class="tab-btn active" onclick="setMode('comprar',this)">Comprar</button>
      <button class="tab-btn" onclick="setMode('vender',this)">Vender</button>
    </div>

    <!-- Panel compra -->
    <div id="panel-comprar">
      <div class="form-group">
        <label>Monto a invertir ($)</label>
        <input type="number" id="monto-comprar" class="input-field" placeholder="Ej: 100" min="1" step="1">
      </div>
      <div id="preview-comprar" style="background:var(--bg);border-radius:8px;padding:.75rem;margin-bottom:1rem;font-size:.85rem;display:none;">
        <div style="display:flex;justify-content:space-between;margin-bottom:.3rem;">
          <span style="color:var(--muted)">Shares estimados</span><span id="est-shares">—</span>
        </div>
        <div style="display:flex;justify-content:space-between;">
          <span style="color:var(--muted)">Precio unitario est.</span><span id="est-precio">—</span>
        </div>
      </div>
      <div id="opcion-sel-label" style="font-size:.8rem;color:var(--muted);margin-bottom:.75rem;"></div>
      <button onclick="ejecutarCompra()" class="btn btn-yes" style="width:100%;padding:.75rem;">Confirmar compra</button>
    </div>

    <!-- Panel venta -->
    <div id="panel-vender" style="display:none;">
      <div class="form-group">
        <label>Shares a vender</label>
        <input type="number" id="shares-vender" class="input-field" placeholder="Ej: 50" min="0.001" step="0.001">
      </div>
      <div id="mis-shares-label" style="font-size:.8rem;color:var(--muted);margin-bottom:.75rem;"></div>
      <button onclick="ejecutarVenta()" class="btn btn-no" style="width:100%;padding:.75rem;">Confirmar venta</button>
    </div>
  `;
}

function renderPanelResuelto(m, ganadora) {
  if (!ganadora) return '<p style="color:var(--muted)">Mercado resuelto.</p>';
  return `
    <div style="text-align:center;padding:.5rem 0 1rem;">
      <div style="font-size:2rem;margin-bottom:.5rem;">🏆</div>
      <div style="font-size:1.1rem;font-weight:700;margin-bottom:.25rem;">${ganadora.nombre} ganó</div>
      <div style="font-size:.82rem;color:var(--muted);margin-bottom:1.5rem;">Mercado cerrado y resuelto</div>
      <p style="font-size:.85rem;color:var(--muted);margin-bottom:1rem;">Si tienes shares ganadores, ve a tu <a href="/portafolio/${USUARIO_ID}/" style="color:var(--accent)">portafolio</a> para redimirlos.</p>
    </div>
  `;
}

function renderOpcionesTabla() {
  const m = mercadoData;
  const tbody = document.getElementById('opciones-tbody');
  if (!tbody) return;

  tbody.innerHTML = m.opciones.map((o, i) => {
    const pct = (o.precio * 100).toFixed(1);
    const color = i === 0 ? 'var(--yes)' : 'var(--no)';
    const contraria = m.opciones.find(x => x.id !== o.id);
    const ganoBadge = o.es_ganadora === true ? '<span class="pill pill-win">✓ Ganó</span>' :
                      o.es_ganadora === false ? '<span class="pill pill-lose">✗ Perdió</span>' : '';

    const btnSi = m.estado === 'abierto'
      ? `<button onclick="selectAndBuy(${o.id},'si')" class="btn btn-yes btn-sm">Sí ${pct}%</button>`
      : '';
    const btnNo = m.estado === 'abierto' && contraria
      ? `<button onclick="selectAndBuy(${contraria.id},'no')" class="btn btn-no btn-sm">No ${(contraria.precio*100).toFixed(1)}%</button>`
      : '';

    return `<tr>
      <td style="font-weight:600;">${o.nombre} ${ganoBadge}</td>
      <td style="text-align:center;">
        <div style="font-weight:700;color:${color};font-size:1rem;">${pct}%</div>
        <div style="background:var(--border);border-radius:3px;height:4px;margin-top:4px;">
          <div style="width:${pct}%;height:100%;border-radius:3px;background:${color};"></div>
        </div>
      </td>
      <td style="text-align:center;">${btnSi}</td>
      <td style="text-align:center;">${btnNo}</td>
    </tr>`;
  }).join('');
}

function selectAndBuy(opcionId, tipo) {
  selectedOpcionId = opcionId;
  const opcion = mercadoData.opciones.find(o => o.id === opcionId);
  const label = document.getElementById('opcion-sel-label');
  if (label && opcion) {
    label.textContent = `Apostando a: ${opcion.nombre} (${(opcion.precio*100).toFixed(1)}¢)`;
  }
  // Switch to buy panel
  setMode('comprar', document.querySelector('.tab-btn'));
  loadMisShares(opcionId);
  updatePreview();
  document.getElementById('monto-comprar')?.focus();
}

function setMode(m, btn) {
  mode = m;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  if (btn) btn.classList.add('active');
  document.getElementById('panel-comprar').style.display = m === 'comprar' ? '' : 'none';
  document.getElementById('panel-vender').style.display = m === 'vender' ? '' : 'none';
  if (m === 'vender' && selectedOpcionId) loadMisShares(selectedOpcionId);
}

function updatePreview() {
  const monto = parseFloat(document.getElementById('monto-comprar')?.value);
  const preview = document.getElementById('preview-comprar');
  if (!preview) return;
  if (!monto || !selectedOpcionId) { preview.style.display='none'; return; }

  const opcion = mercadoData.opciones.find(o => o.id === selectedOpcionId);
  const otra = mercadoData.opciones.find(o => o.id !== selectedOpcionId);
  if (!opcion || !otra) return;

  const k = opcion.tokens * otra.tokens;
  const nuevoB = otra.tokens + monto;
  const nuevoA = k / nuevoB;
  const shares = opcion.tokens - nuevoA;
  const precio = monto / shares;

  document.getElementById('est-shares').textContent = shares.toFixed(4);
  document.getElementById('est-precio').textContent = `$${precio.toFixed(4)}`;
  preview.style.display = '';
}

async function loadMisShares(opcionId) {
  try {
    const r = await fetch(`/api/portafolio/${USUARIO_ID}/`);
    const d = await r.json();
    const pos = d.portafolio.find(p => p.opcion_id === opcionId);
    const el = document.getElementById('mis-shares-label');
    if (el) el.textContent = pos ? `Tienes: ${pos.shares.toFixed(4)} shares` : 'No tienes shares de esta opción';
  } catch {}
}

async function ejecutarCompra() {
  const monto = parseFloat(document.getElementById('monto-comprar')?.value);
  if (!monto || monto <= 0) { toast('Ingresa un monto válido','err'); return; }
  if (!selectedOpcionId) { toast('Selecciona una opción en la tabla de arriba','err'); return; }
  const r = await fetch('/comprar/',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({id_usuario:USUARIO_ID,id_opcion:selectedOpcionId,monto})});
  const d = await r.json();
  if (d.ok) {
    toast(`Compraste ${parseFloat(d.shares).toFixed(4)} shares a $${parseFloat(d.precio_unitario).toFixed(4)}`,'ok');
    fetchBalance(); loadMercado();
  } else { toast(d.error||'Error','err'); }
}

async function ejecutarVenta() {
  const shares = parseFloat(document.getElementById('shares-vender')?.value);
  if (!shares || shares <= 0) { toast('Ingresa shares válidos','err'); return; }
  if (!selectedOpcionId) { toast('Selecciona una opción en la tabla de arriba','err'); return; }
  const r = await fetch('/vender/',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({id_usuario:USUARIO_ID,id_opcion:selectedOpcionId,shares})});
  const d = await r.json();
  if (d.ok) {
    toast(`Vendiste por $${parseFloat(d.monto).toFixed(2)}`,'ok');
    fetchBalance(); loadMercado();
  } else { toast(d.error||'Error','err'); }
}

async function resolverMercado(opcionGanadoraId) {
  const opcion = mercadoData.opciones.find(o => o.id === opcionGanadoraId);
  if (!confirm(`¿Resolver el mercado declarando a "${opcion?.nombre}" como ganador?`)) return;
  const r = await fetch(`/api/mercado/${MERCADO_ID}/resolver/`,{method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({opcion_ganadora_id:opcionGanadoraId})});
  const d = await r.json();
  if (d.ok) { toast(`Mercado resuelto: ${d.opcion_ganadora} ganó`,'ok'); loadMercado(); }
  else { toast(d.error||'Error','err'); }
}

async function loadChart() {
  const r = await fetch(`/api/mercado/${MERCADO_ID}/historial/`);
  const data = await r.json();
  const canvas = document.getElementById('price-chart');
  if (!canvas) return;

  const colors = ['#00b894','#d63031','#6c5ce7','#fdcb6e'];
  const datasets = Object.entries(data.historial).map(([nombre, puntos], i) => ({
    label: nombre,
    data: puntos.map(p => ({ x: p.fecha, y: (p.precio * 100).toFixed(2) })),
    borderColor: colors[i % colors.length],
    backgroundColor: colors[i % colors.length] + '22',
    borderWidth: 2,
    pointRadius: puntos.length < 20 ? 3 : 0,
    tension: 0.3,
    fill: false,
  }));

  if (priceChart) priceChart.destroy();
  priceChart = new Chart(canvas, {
    type: 'line',
    data: { datasets },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      interaction: { mode: 'index', intersect: false },
      scales: {
        x: {
          type: 'time' in Chart.registry?.scales ? 'time' : 'category',
          ticks: { color: '#888899', maxTicksLimit: 6 },
          grid: { color: '#2a2a3d' },
        },
        y: {
          min: 0, max: 100,
          ticks: { color: '#888899', callback: v => v + '%' },
          grid: { color: '#2a2a3d' },
        },
      },
      plugins: {
        legend: { labels: { color: '#e8e8f0', boxWidth: 12 } },
        tooltip: {
          callbacks: { label: ctx => ` ${ctx.dataset.label}: ${ctx.parsed.y}%` },
        },
      },
    },
  });
}

loadMercado();
</script>
{% endblock %}
