{% extends "base.html" %}
{% block title %}Ranking — Polybuxef{% endblock %}

{% block extra_head %}
<style>
  .rank-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 1.75rem;
  }
  .rank-meta { font-size: 0.78rem; color: var(--muted); margin-top: 0.2rem; }

  .btn-actualizar {
    display: inline-flex; align-items: center; gap: 0.45rem;
    background: #000; color: #fff;
    padding: 0.55rem 1.4rem; border-radius: 9999px;
    font-size: 0.82rem; font-weight: 700;
    border: none; cursor: pointer; transition: opacity 0.15s;
  }
  .btn-actualizar:hover { opacity: 0.75; }
  .btn-actualizar:disabled { opacity: 0.45; cursor: not-allowed; }
  .btn-actualizar svg { transition: transform 0.5s; }
  .btn-actualizar.spinning svg { animation: spin 0.7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .rank-table-wrap {
    background: #fff; border: 1px solid #e0e0e0; border-radius: 1.25rem; overflow: hidden;
    max-width: 800px;
  }
  .rank-table { width: 100%; border-collapse: collapse; }
  .rank-table thead th {
    background: #f5f5f5; padding: 0.75rem 1.25rem;
    font-size: 0.72rem; font-weight: 600; color: var(--muted);
    text-transform: uppercase; letter-spacing: 0.06em; text-align: left;
    border-bottom: 1px solid #e0e0e0;
  }
  .rank-table thead th.col-pos { width: 56px; text-align: center; }
  .rank-table thead th.col-saldo { text-align: right; }
  .rank-table tbody tr { border-bottom: 1px solid #f0f0f0; transition: background 0.12s; }
  .rank-table tbody tr:last-child { border-bottom: none; }
  .rank-table tbody tr:hover { background: #fafafa; }
  .rank-table tbody td { padding: 0.9rem 1.25rem; font-size: 0.88rem; color: #333; }

  .col-pos { text-align: center; }
  .pos-badge {
    display: inline-flex; align-items: center; justify-content: center;
    width: 28px; height: 28px; border-radius: 50%;
    font-size: 0.78rem; font-weight: 700; background: #f0f0f0; color: var(--accent);
  }
  .pos-badge.gold   { background: #fff7e0; color: #d4a017; }
  .pos-badge.silver { background: #f0f0f0; color: #888; }
  .pos-badge.bronze { background: #fff1eb; color: #c0622c; }

  .user-nombre   { font-weight: 600; color: #111; }
  .user-username { font-size: 0.75rem; color: var(--muted); margin-top: 0.1rem; }

  .col-saldo { text-align: right; }
  .saldo-val { font-weight: 700; color: var(--yes); font-size: 0.92rem; }

  .rank-table tbody tr.mi-fila { background: #f0f9f5 !important; }
  .rank-table tbody tr.mi-fila .pos-badge { background: #c8f0e0; color: var(--yes); }

  .rank-empty { text-align: center; padding: 3rem; color: var(--muted); font-size: 0.9rem; }
  .rank-timestamp { text-align: right; font-size: 0.73rem; color: #bbb; margin-top: 0.75rem; max-width: 800px; }

  @media (max-width: 600px) {
    .rank-table tbody td { padding: 0.7rem 0.75rem; font-size: 0.82rem; }
    .rank-table thead th { padding: 0.6rem 0.75rem; }
    .user-username { display: none; }
  }
</style>
{% endblock %}


{% block content %}
<div class="rank-header">
  <div>
    <div class="page-title" style="margin-bottom:0;">Ranking</div>
    <div class="rank-meta" id="rankMeta">Top 100 usuarios por saldo</div>
  </div>
  <button class="btn-actualizar" id="btnActualizar" onclick="cargarRanking()">
    <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
      <path d="M1 4v6h6M23 20v-6h-6" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4-4.64 4.36A9 9 0 0 1 3.51 15"
            stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    Actualizar
  </button>

</div>

<div class="rank-table-wrap">
  <table class="rank-table">
    <thead>
      <tr>
        <th class="col-pos">#</th>
        <th>Usuario</th>
        <th class="col-saldo">Saldo</th>
      </tr>
    </thead>
    <tbody id="rankBody"></tbody>
  </table>
</div>

<div class="rank-timestamp" id="rankTimestamp"></div>
{% endblock %}

{% block extra_js %}
<script>
  function escaparHtml(str) {
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function claseBadge(pos) {
    if (pos === 1) return 'pos-badge gold';
    if (pos === 2) return 'pos-badge silver';
    if (pos === 3) return 'pos-badge bronze';
    return 'pos-badge';
  }

  async function cargarRanking() {
    const btn   = document.getElementById('btnActualizar');
    const tbody = document.getElementById('rankBody');

    btn.disabled = true;
    btn.classList.add('spinning');

    try {
      const r = await fetch('/api/ranking/');
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      const data = await r.json();
      const lista = data.ranking;

      if (!lista.length) {
        tbody.innerHTML = '<tr><td colspan="3" class="rank-empty">No hay usuarios registrados aún.</td></tr>';
        return;
      }

      tbody.innerHTML = lista.map(u => {
        const esMio   = USUARIO_ID && u.id === USUARIO_ID;
        const saldoFmt = parseFloat(u.saldo).toLocaleString('es-CL', {
          minimumFractionDigits: 2,
          maximumFractionDigits: 2
        });
        return `
          <tr${esMio ? ' class="mi-fila"' : ''}>
            <td class="col-pos">
              <span class="${claseBadge(u.posicion)}">${u.posicion}</span>
            </td>
            <td>
              <div class="user-nombre">
                ${escaparHtml(u.nombre)}
                ${esMio ? '<span style="font-size:0.7rem;color:var(--yes);font-weight:600;margin-left:0.35rem;">(tú)</span>' : ''}
              </div>
              <div class="user-username">@${escaparHtml(u.username)}</div>
            </td>
            <td class="col-saldo">
              <span class="saldo-val">$ ${saldoFmt}</span>
            </td>
          </tr>`;
      }).join('');

      document.getElementById('rankMeta').textContent = `${lista.length} usuarios en el ranking`;
      const ahora = new Date();
      document.getElementById('rankTimestamp').textContent =
        `Actualizado: ${ahora.toLocaleDateString('es-CL')} ${ahora.toLocaleTimeString('es-CL', {hour: '2-digit', minute: '2-digit'})}`;

    } catch (e) {
      tbody.innerHTML = '<tr><td colspan="3" class="rank-empty">Error al cargar el ranking. Intenta de nuevo.</td></tr>';
      toast('Error al cargar el ranking', 'err');
    } finally {
      btn.disabled = false;
      btn.classList.remove('spinning');
    }
  }

  cargarRanking();
</script>
{% endblock %}
